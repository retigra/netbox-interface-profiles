---
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  # Called by the publish workflow, so a release is only published when the tests pass
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Ruff
        run: uvx ruff@0.14.14 check interface_profiles/

  test:
    name: Test (NetBox ${{ matrix.netbox-version }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    # The plugin is bound to NetBox versions, so each NetBox version is tested with the Python version of its official
    # Docker image. Add an entry here to test another NetBox version.
    strategy:
      fail-fast: false
      matrix:
        include:
          - netbox-version: "4.7.3"
            python-version: "3.14"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Clone NetBox
        run: |
          git clone --depth 1 --branch v${{ matrix.netbox-version }} https://github.com/netbox-community/netbox.git

      - name: Install NetBox dependencies
        working-directory: netbox
        # tblib lets the parallel test runner report failures instead of crashing on unpicklable tracebacks
        run: uv pip install --system -r requirements.txt tblib

      - name: Install plugin
        working-directory: plugin
        run: uv pip install --system -e . --no-deps

      - name: Configure NetBox
        working-directory: netbox/netbox
        run: |
          cp ../../plugin/testing/configuration.py netbox/configuration.py

      - name: Run database migrations
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py migrate --no-input

      - name: Check for missing migrations
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py makemigrations --check interface_profiles

      - name: Collect static files
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py collectstatic --no-input

      - name: Run tests
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py test interface_profiles.tests --parallel --keepdb -v 2
