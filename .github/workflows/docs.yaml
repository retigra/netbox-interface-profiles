---
name: Docs

# Every version of the documentation is built into its own folder: main as /dev/, release tag vX.Y.Z as /X.Y/ and,
# for the newest release, /latest/. The folders are kept on the gh-pages branch and deployed to GitHub Pages.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

# Deploys update the shared gh-pages branch, so they must not run concurrently
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1,2)
          else
            version=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Check out the published versions
        if: github.event_name != 'pull_request'
        run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add -B gh-pages ../site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages ../site
          fi

      - name: Add this version
        if: github.event_name != 'pull_request'
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf "../site/$VERSION"
          cp -r dist "../site/$VERSION"
          echo "alias=$(node scripts/update-versions.mjs ../site "$VERSION")" >> "$GITHUB_OUTPUT"

      - name: Build latest
        if: steps.publish.outputs.alias == 'latest'
        env:
          DOCS_VERSION: latest
        run: |
          npm run build
          rm -rf ../site/latest
          cp -r dist ../site/latest

      - name: Push the published versions
        if: github.event_name != 'pull_request'
        working-directory: site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Deploy docs $VERSION from ${GITHUB_SHA::7}" || echo "No changes"
          git push origin gh-pages

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
