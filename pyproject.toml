# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-interface-profiles"
version = "0.1.0"
authors = [{ name = "Wouter de Bruijn", email = "wouter@retigra.nl" }]
description = "NetBox plugin for managing interface configuration profiles."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["netbox", "netbox-plugin"]

classifiers = [
    'Development Status :: 3 - Alpha',
    'Framework :: Django',
    'Framework :: Django :: 6.1',
    'Intended Audience :: Developers',
    'Intended Audience :: System Administrators',
    'Intended Audience :: Telecommunications Industry',
    'Natural Language :: English',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: System :: Networking',
]

requires-python = ">=3.12.0"

[project.optional-dependencies]
test = ["check-manifest==0.51", "ruff==0.14.14", "pytest==9.0.2"]

[project.urls]
Documentation = "https://retigra.github.io/netbox-interface-profiles/"
Source = "https://github.com/retigra/netbox-interface-profiles"
Tracker = "https://github.com/retigra/netbox-interface-profiles/issues"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docker/**", "docs/netbox"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by ruff-format
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.setuptools.packages.find]
where = ["."]
include = ["interface_profiles*"]

[tool.setuptools.package-data]
interface_profiles = ["templates/**", "static/**", "locale/**/*.mo"]

[dependency-groups]
dev = [
    "netbox-types==4.7.4.1",
    "ruff>=0.14.14",
    "ty>=0.0.20",
]
test = ["bs4>=0.0.2"]

[tool.ty.src]
exclude = ["build/**", "docker/**", "docs/netbox/**", "interface_profiles/testing/**"]
