{% load i18n %}
<div class="btn-group">
  <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
    <i class="mdi mdi-check-all" aria-hidden="true"></i> {{ label }}
  </button>
  <ul class="dropdown-menu">
    {% for profile in profiles %}
      <li>
        <button type="submit" name="_assign" value="{{ profile.pk }}" class="dropdown-item"{% if profile.description %} title="{{ profile.description }}"{% endif %}>
          {{ profile.name }}
        </button>
      </li>
    {% empty %}
      <li><span class="dropdown-item-text text-muted">{% trans "No applicable profiles" %}</span></li>
    {% endfor %}
  </ul>
</div>
