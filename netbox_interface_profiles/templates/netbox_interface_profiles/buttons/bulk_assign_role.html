{% load i18n %}
<div class="btn-group">
  <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
    <i class="mdi mdi-check-all" aria-hidden="true"></i> {{ label }}
  </button>
  <ul class="dropdown-menu">
    {% for role in roles %}
      <li>
        <button type="submit" name="_assign" value="{{ role.pk }}" class="dropdown-item"{% if role.description %} title="{{ role.description }}"{% endif %}>
          {{ role.name }}
        </button>
      </li>
    {% empty %}
      <li><span class="dropdown-item-text text-muted">{% trans "No applicable roles" %}</span></li>
    {% endfor %}
  </ul>
</div>
