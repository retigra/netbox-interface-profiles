{% load i18n %}

{% for profile in profiles %}
  <li>
    <button
      type="button"
      class="dropdown-item{% if current_profile and current_profile.pk == profile.pk %} active{% endif %}"
      hx-post="{% url 'plugins:netbox_interface_profiles:interfaceprofileassignment_htmx_set' interface_id=interface.pk profile_id=profile.pk %}"
      hx-swap="none"
      {% if profile.pk not in assignable_profile_ids %}disabled title="{% trans "You are not permitted to assign this profile" %}"{% endif %}
    >
      {% if current_profile and current_profile.pk == profile.pk %}<i class="mdi mdi-check"></i>{% endif %}
      {{ profile.name }}
    </button>
  </li>
{% empty %}
  <li><span class="dropdown-item-text text-muted">{% trans "No applicable profiles" %}</span></li>
{% endfor %}

{% if can_clear %}
  <li><hr class="dropdown-divider"></li>
  <li>
    <button
      type="button"
      class="dropdown-item text-danger"
      hx-post="{% url 'plugins:netbox_interface_profiles:interfaceprofileassignment_htmx_remove' interface_id=interface.pk %}"
      hx-swap="none"
    >
      <i class="mdi mdi-close-circle-outline"></i> {% trans "Clear Assignment" %}
    </button>
  </li>
{% endif %}
